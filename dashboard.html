        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #2e7d32 0%, #ff9800 50%); padding: 20px; }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #2e7d32 0%, #81c784 100%);
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo { font-size: 1.8rem; font-weight: 700; display: flex; align-items: center; }
        .logo-icon { margin-right: 10px; font-size: 2rem; }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: white;
            color: #2e7d32;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.5rem;

        .btn-logout {

        .main-content {

    }

    
        
        .therapy-item {

                /* 图表相关样式 */

            padding: 20px;
            background: white;
            border-radius: 12px;

            margin-bottom: 15px;

            color: var(--text-color);

            align-items: center;

        }

        }

            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
            display: block;
        }

        .chart-stats .stat-label {
            font-size: 0.8rem;
            color: var(--text-light);
        }

        .chart-container {

            height: 250px;

        .time-range-selector {

            align-items: center;
            gap: 10px;

            border-color: var(--primary-color);

        /* 健康报告样式 */

        .health-report {

// 验证token的函数
async function validateToken(token) {
    try {
        const response = await fetch('http://localhost:3000/api/validate-token', {
            method: 'GET',
            headers: {
                'Authorization': 'Bearer ' + token,
                'Content-Type': 'application/json'
            }
        });
        
        if (response.ok) {
            const data = await response.json();
            return data.code === 200;
        }
        return false;
    } catch (error) {
        console.error('token验证失败:', error);
        return false;
    }
}

    document.getElementById('user-avatar').textContent = (currentUser.nickname || currentUser.username).charAt(0).toUpperCase();
    document.getElementById('welcome-message').textContent = `你好，${currentUser.nickname || currentUser.username}！`;
    
    // 加载其他数据
    loadHealthInfo();
    loadTherapies();
    
    console.log('页面内容加载完成');
}

        
        // 加载健康信息
        async function loadHealthInfo() {
            try {
                const response = await fetch(`http://localhost:3000/api/health-info?user_id=${currentUser.id}`);

                if (data.code === 200 && data.data) {

// 获取健康记录数据
async function fetchHealthRecords(days) {
    const userInfo = localStorage.getItem('userInfo');
    if (!userInfo) {
        throw new Error('用户未登录');
    }
    
    const user = JSON.parse(userInfo);
    const response = await fetch(`http://localhost:3000/api/user/health-records?user_id=${user.id}&limit=${days}`);
    
    if (!response.ok) {
        throw new Error(`API错误: ${response.status}`);
    }
    
    const result = await response.json();
    
    if (result.code === 200) {
        return result.data || [];
    } else {
        throw new Error(result.msg);
    }
}

// 处理图表数据
function processChartData(records, days) {
    // 如果没有真实数据，返回模拟数据
    if (!records || records.length === 0) {
        return getMockData(days);
    }
    
    // 排序：按日期升序
    records.sort((a, b) => new Date(a.record_date) - new Date(b.record_date));
    
    const data = {
        dates: [],
        weight: [],
        bpSys: [],
        bpDia: [],
        sleep: [],
        sugar: []
    };
    
    records.forEach(record => {
        const date = new Date(record.record_date);
        const dateStr = `${date.getMonth() + 1}-${date.getDate()}`;
        
        data.dates.push(dateStr);
        data.weight.push(record.weight || null);
        data.bpSys.push(record.blood_pressure_sys || null);
        data.bpDia.push(record.blood_pressure_dia || null);
        data.sleep.push(record.sleep_hours || null);
        data.sugar.push(record.blood_sugar || null);
    });
    
    return data;
}

// 获取模拟数据
function getMockData(days) {
    const data = { ...mockHealthData };
    
    // 只取最近days天的数据
    if (days < data.dates.length) {
        data.dates = data.dates.slice(-days);
        data.weight = data.weight.slice(-days);
        data.bpSys = data.bpSys.slice(-days);
        data.bpDia = data.bpDia.slice(-days);
        data.sleep = data.sleep.slice(-days);
        data.sugar = data.sugar.slice(-days);
    }
    
    return data;
}

// 更新图表统计信息
function updateChartStats(data) {
    // 体重变化
    if (data.weight.length >= 2) {
        const firstWeight = data.weight[0];
        const lastWeight = data.weight[data.weight.length - 1];
        const change = (lastWeight - firstWeight).toFixed(1);
        document.getElementById('weight-change').textContent = 
            `${change > 0 ? '+' : ''}${change}`;
        document.getElementById('weight-change').style.color = 
            change < 0 ? '#4caf50' : change > 0 ? '#f44336' : '#666';
    }
    
    // 血压平均值
    const validBpSys = data.bpSys.filter(v => v !== null);
    const validBpDia = data.bpDia.filter(v => v !== null);
    if (validBpSys.length > 0 && validBpDia.length > 0) {
        const avgSys = (validBpSys.reduce((a, b) => a + b, 0) / validBpSys.length).toFixed(0);
        const avgDia = (validBpDia.reduce((a, b) => a + b, 0) / validBpDia.length).toFixed(0);
        document.getElementById('bp-avg').textContent = `${avgSys}/${avgDia}`;
    }
    
    // 睡眠平均值
    const validSleep = data.sleep.filter(v => v !== null);
    if (validSleep.length > 0) {
        const avgSleep = (validSleep.reduce((a, b) => a + b, 0) / validSleep.length).toFixed(1);
        document.getElementById('sleep-avg').textContent = avgSleep;
    }
    
    // 血糖平均值
    const validSugar = data.sugar.filter(v => v !== null);
    if (validSugar.length > 0) {
        const avgSugar = (validSugar.reduce((a, b) => a + b, 0) / validSugar.length).toFixed(1);
        document.getElementById('sugar-avg').textContent = avgSugar;
    }
}

function createWeeklyReport(records, user) {
    const now = new Date();
    const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);

    };

// 计算报告统计
function calculateReportStats(records) {
    const stats = {
        weight: { current: null, change: 0, avg: 0, min: Infinity, max: -Infinity },
        bpSys: { current: null, avg: 0, min: Infinity, max: -Infinity },
        bpDia: { current: null, avg: 0, min: Infinity, max: -Infinity },
        sleep: { current: null, avg: 0, min: Infinity, max: -Infinity },
        sugar: { current: null, avg: 0, min: Infinity, max: -Infinity },
        recordCount: records.length
    };
    
    // 过滤有效数据
    const validRecords = records.filter(r => r.weight || r.blood_pressure_sys || r.sleep_hours || r.blood_sugar);
    
    if (validRecords.length === 0) {
        return stats;
    }
    
    // 按日期排序
    validRecords.sort((a, b) => new Date(a.record_date) - new Date(b.record_date));
    
    // 计算各项指标
    let totalWeight = 0, totalBpSys = 0, totalBpDia = 0, totalSleep = 0, totalSugar = 0;
    let weightCount = 0, bpCount = 0, sleepCount = 0, sugarCount = 0;
    
    validRecords.forEach(record => {
        // 体重
        if (record.weight) {
            stats.weight.current = record.weight;
            stats.weight.min = Math.min(stats.weight.min, record.weight);
            stats.weight.max = Math.max(stats.weight.max, record.weight);
            totalWeight += record.weight;
            weightCount++;
        }
        
        // 血压
        if (record.blood_pressure_sys && record.blood_pressure_dia) {
            stats.bpSys.current = record.blood_pressure_sys;
            stats.bpDia.current = record.blood_pressure_dia;
            
            stats.bpSys.min = Math.min(stats.bpSys.min, record.blood_pressure_sys);
            stats.bpSys.max = Math.max(stats.bpSys.max, record.blood_pressure_sys);
            stats.bpDia.min = Math.min(stats.bpDia.min, record.blood_pressure_dia);
            stats.bpDia.max = Math.max(stats.bpDia.max, record.blood_pressure_dia);
            
            totalBpSys += record.blood_pressure_sys;
            totalBpDia += record.blood_pressure_dia;
            bpCount++;
        }
        
        // 睡眠
        if (record.sleep_hours) {
            stats.sleep.current = record.sleep_hours;
            stats.sleep.min = Math.min(stats.sleep.min, record.sleep_hours);
            stats.sleep.max = Math.max(stats.sleep.max, record.sleep_hours);
            totalSleep += record.sleep_hours;
            sleepCount++;
        }
        
        // 血糖
        if (record.blood_sugar) {
            stats.sugar.current = record.blood_sugar;
            stats.sugar.min = Math.min(stats.sugar.min, record.blood_sugar);
            stats.sugar.max = Math.max(stats.sugar.max, record.blood_sugar);
            totalSugar += record.blood_sugar;
            sugarCount++;
        }
    });
    
    // 计算平均值
    if (weightCount > 0) {
        stats.weight.avg = totalWeight / weightCount;
        if (validRecords.length >= 2) {
            const firstWeight = validRecords[0].weight;
            const lastWeight = validRecords[validRecords.length - 1].weight;
            stats.weight.change = lastWeight - firstWeight;
        }
    }
    
    if (bpCount > 0) {
        stats.bpSys.avg = totalBpSys / bpCount;
        stats.bpDia.avg = totalBpDia / bpCount;
    }
    
    if (sleepCount > 0) {
        stats.sleep.avg = totalSleep / sleepCount;
    }
    
    if (sugarCount > 0) {
        stats.sugar.avg = totalSugar / sugarCount;
    }
    
    return stats;
}

// 生成健康建议
function generateRecommendations(stats) {
    const recommendations = [];
    
    // 体重建议
    if (stats.weight.current) {
        if (stats.weight.change < -0.5) {
            recommendations.push({
                icon: 'fa-weight',
                title: '体重下降',
                content: '您的体重有所下降，建议注意营养均衡，避免过度减重。'
            });
        } else if (stats.weight.change > 0.5) {
            recommendations.push({
                icon: 'fa-weight',
                title: '体重上升',
                content: '您的体重有所上升，建议适当控制饮食，增加运动。'
            });
        }
    }
    
    // 血压建议
    if (stats.bpSys.avg > 0) {
        if (stats.bpSys.avg > 130 || stats.bpDia.avg > 85) {
            recommendations.push({
                icon: 'fa-heartbeat',
                title: '血压偏高',
                content: '您的血压偏高，建议减少盐分摄入，保持规律运动，必要时咨询医生。'
            });
        }
    }
    
    // 睡眠建议
    if (stats.sleep.avg > 0) {
        if (stats.sleep.avg < 7) {
            recommendations.push({
                icon: 'fa-bed',
                title: '睡眠不足',
                content: '您平均睡眠时间不足7小时，建议调整作息，保证充足睡眠。'
            });
        } else if (stats.sleep.avg > 9) {
            recommendations.push({
                icon: 'fa-bed',
                title: '睡眠过长',
                content: '您平均睡眠时间超过9小时，建议保持7-9小时健康睡眠。'
            });
        }
    }
    
    // 血糖建议
    if (stats.sugar.avg > 0) {
        if (stats.sugar.avg > 6.1) {
            recommendations.push({
                icon: 'fa-tint',
                title: '血糖偏高',
                content: '您的空腹血糖偏高，建议控制糖分摄入，增加膳食纤维。'
            });
        } else if (stats.sugar.avg < 3.9) {
            recommendations.push({
                icon: 'fa-tint',
                title: '血糖偏低',
                content: '您的空腹血糖偏低，建议按时进食，避免长时间空腹。'
            });
        }
    }
    
    // 通用建议
    if (recommendations.length === 0) {
        recommendations.push({
            icon: 'fa-thumbs-up',
            title: '状态良好',
            content: '您的各项指标基本正常，请继续保持健康的生活习惯！'
        });
    }
    
    recommendations.push({
        icon: 'fa-apple-alt',
        title: '均衡饮食',
        content: '建议每天摄入足够的蔬菜水果，保持饮食多样化。'
    });
    
    recommendations.push({
        icon: 'fa-running',
        title: '规律运动',
        content: '建议每周进行3-5次中等强度运动，每次30分钟以上。'
    });
    
    return recommendations;
}

// 显示健康报告
function displayHealthReport(report, type) {
    const reportContainer = document.getElementById('health-report');
    const placeholder = document.getElementById('report-placeholder');
    
    // 隐藏占位符，显示报告
    placeholder.style.display = 'none';
    reportContainer.style.display = 'block';
    
    // 生成报告HTML
    let reportHTML = `
        <div class="report-header">
            <h3>${report.title}</h3>
            <p class="report-period">${report.period}</p>
            <p style="color: #666; font-size: 0.9rem; margin-top: 5px;">
                生成时间: ${report.generatedAt}
            </p>
        </div>
        
        <div class="report-summary">
            <div class="summary-item">
                <div class="summary-label">记录天数</div>
                <div class="summary-value">${report.stats.recordCount}</div>
                <div class="summary-label">天</div>
            </div>
    `;
    
    // 体重摘要
    if (report.stats.weight.current) {
        const change = report.stats.weight.change;
        const changeClass = change < 0 ? 'good' : change > 0 ? 'warning' : '';
        const changeSymbol = change > 0 ? '+' : '';
        
        reportHTML += `
            <div class="summary-item ${changeClass}">
                <div class="summary-label">当前体重</div>
                <div class="summary-value">${report.stats.weight.current.toFixed(1)}</div>
                <div class="summary-label">${changeSymbol}${change.toFixed(1)} kg 变化</div>
            </div>
        `;
    }
    
    // 血压摘要
    if (report.stats.bpSys.avg > 0) {
        reportHTML += `
            <div class="summary-item">
                <div class="summary-label">平均血压</div>
                <div class="summary-value">${report.stats.bpSys.avg.toFixed(0)}/${report.stats.bpDia.avg.toFixed(0)}</div>
                <div class="summary-label">mmHg</div>
            </div>
        `;
    }
    
    // 睡眠摘要
    if (report.stats.sleep.avg > 0) {
        const sleepClass = report.stats.sleep.avg >= 7 ? 'good' : 'attention';
        reportHTML += `
            <div class="summary-item ${sleepClass}">
                <div class="summary-label">平均睡眠</div>
                <div class="summary-value">${report.stats.sleep.avg.toFixed(1)}</div>
                <div class="summary-label">小时/天</div>
            </div>
        `;
    }
    
    reportHTML += `</div>`;
    
    // 添加建议
    if (report.recommendations && report.recommendations.length > 0) {
        reportHTML += `
            <div class="report-recommendations">
                <h4 style="margin-bottom: 20px; color: var(--primary-color);">
                    <i class="fas fa-lightbulb"></i> 健康建议
                </h4>
        `;
        
        report.recommendations.forEach(rec => {
            reportHTML += `
                <div class="recommendation-item">
                    <div class="recommendation-icon">
                        <i class="fas ${rec.icon}"></i>
                    </div>
                    <div class="recommendation-content">
                        <h5>${rec.title}</h5>
                        <p>${rec.content}</p>
                    </div>
                </div>
            `;
        });
        
        reportHTML += `</div>`;
    }
    
    // 添加操作按钮
    reportHTML += `
        <div class="report-actions">
            <button class="btn-secondary" onclick="printReport()">
                <i class="fas fa-print"></i> 打印报告
            </button>
            <button class="btn-primary" onclick="saveReport()">
                <i class="fas fa-save"></i> 保存报告
            </button>
        </div>
    `;
    
    reportContainer.innerHTML = reportHTML;
}

// 打印报告
function printReport() {
    const reportElement = document.getElementById('health-report');
    const originalContents = document.body.innerHTML;
    
    document.body.innerHTML = reportElement.innerHTML;
    window.print();
    document.body.innerHTML = originalContents;
    
    // 重新加载页面以恢复功能
    window.location.reload();
}
