<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>饮食记录 - 慧膳食刻</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        :root {
            --primary-color: #2e7d32;
            --primary-light: #4caf50;
            --primary-dark: #1b5e20;
            --secondary-color: #ff9800;
            --bg-color: #f8f9fa;
            --card-color: #ffffff;
            --text-color: #333333;
            --text-light: #666666;
            --border-color: #e0e0e0;
            --breakfast-color: #ffb74d;
            --lunch-color: #4caf50;
            --dinner-color: #2196f3;
            --snack-color: #9c27b0;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        /* 头部样式 */
        .header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            color: white;
            padding: 30px 40px;
            position: relative;
            overflow: hidden;
        }
        
        .header-content {
            position: relative;
            z-index: 1;
        }
        
        .header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        /* 导航栏 */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: var(--card-color);
            border-bottom: 1px solid var(--border-color);
        }
        
        .nav-links {
            display: flex;
            gap: 20px;
        }
        
        .nav-links a {
            text-decoration: none;
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 25px;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .nav-links a:hover {
            background: #f0f0f0;
        }
        
        .nav-links a.active {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            color: white;
        }
        
        /* 主要内容 */
        .main-content {
            padding: 30px 40px;
        }
        
        /* 统计卡片 */
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: var(--card-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
        }
        
        .stat-content {
            flex: 1;
        }
        
        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-color);
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: var(--text-light);
        }
        
        .stat-change {
            font-size: 0.85rem;
            margin-top: 5px;
        }
        
        .stat-change.positive {
            color: var(--primary-color);
        }
        
        .stat-change.negative {
            color: #f44336;
        }
        
        /* 操作栏 */
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .date-navigation {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-date {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-date:hover {
            background: #f5f5f5;
        }
        
        .current-date {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
            min-width: 120px;
            text-align: center;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 125, 50, 0.3);
        }
        
        /* 餐次标签 */
        .meal-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        .meal-tab {
            padding: 10px 20px;
            border: 1px solid var(--border-color);
            border-radius: 25px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .meal-tab:hover {
            background: #f5f5f5;
        }
        
        .meal-tab.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        
        .meal-tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .meal-tag.breakfast {
            background: rgba(255, 183, 77, 0.2);
            color: var(--breakfast-color);
        }
        
        .meal-tag.lunch {
            background: rgba(76, 175, 80, 0.2);
            color: var(--lunch-color);
        }
        
        .meal-tag.dinner {
            background: rgba(33, 150, 243, 0.2);
            color: var(--dinner-color);
        }
        
        .meal-tag.snack {
            background: rgba(156, 39, 176, 0.2);
            color: var(--snack-color);
        }
        
        /* 饮食记录列表 */
        .diet-records {
            margin-bottom: 40px;
        }
        
        .record-item {
            background: var(--card-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
            border-left: 4px solid var(--primary-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.3s;
        }
        
        .record-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        
        .record-info {
            flex: 1;
        }
        
        .record-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }
        
        .record-time {
            color: var(--text-light);
            font-size: 0.9rem;
        }
        
        .record-foods {
            margin-bottom: 10px;
        }
        
        .food-tag {
            display: inline-block;
            background: #f5f5f5;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.9rem;
            margin-right: 8px;
            margin-bottom: 5px;
        }
        
        .record-nutrition {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        
        .nutrition-item {
            text-align: center;
        }
        
        .nutrition-value {
            font-weight: 600;
            color: var(--text-color);
        }
        
        .nutrition-label {
            font-size: 0.8rem;
            color: var(--text-light);
        }
        
        .record-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-icon:hover {
            background: #f5f5f5;
        }
        
        .btn-edit:hover {
            color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .btn-delete:hover {
            color: #f44336;
            border-color: #f44336;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }
        
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        
        /* 营养成分图表 */
        .nutrition-chart {
            background: var(--card-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
            margin-bottom: 40px;
        }
        
        .chart-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-color);
        }
        
        .macronutrients {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .macro-item {
            flex: 1;
            text-align: center;
        }
        
        .macro-bar {
            height: 8px;
            background: #f0f0f0;
            border-radius: 4px;
            margin: 10px 0;
            overflow: hidden;
        }
        
        .macro-fill {
            height: 100%;
            border-radius: 4px;
        }
        
        .carbs .macro-fill {
            background: #ff9800;
        }
        
        .protein .macro-fill {
            background: #4caf50;
        }
        
        .fat .macro-fill {
            background: #2196f3;
        }
        
        .micronutrients {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .micro-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 8px;
        }
        
        /* 常用食物 */
        .common-foods {
            background: var(--card-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        }
        
        .foods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .food-card {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .food-card:hover {
            border-color: var(--primary-color);
            transform: translateY(-3px);
        }
        
        .food-name {
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .food-calories {
            color: var(--text-light);
            font-size: 0.9rem;
        }
        
        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalFadeIn 0.3s ease;
        }
        
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-color);
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
        }
        
        .modal-body {
            padding: 20px;
        }
        
        .modal-footer {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        
        /* 表单样式 */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-color);
        }
        
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .btn-secondary {
            background: white;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-secondary:hover {
            background: #f5f5f5;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .nav-bar {
                flex-direction: column;
                gap: 20px;
            }
            
            .stats-cards {
                grid-template-columns: 1fr 1fr;
            }
            
            .macronutrients {
                flex-direction: column;
            }
            
            .record-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            
            .record-actions {
                align-self: flex-end;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .action-bar {
                flex-direction: column;
                align-items: flex-start;
            }
        }
        
        /* 消息提示 */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .toast-success {
            background: linear-gradient(135deg, #4caf50, #2e7d32);
        }
        
        .toast-error {
            background: linear-gradient(135deg, #f44336, #d32f2f);
        }
        
        .toast-info {
            background: linear-gradient(135deg, #2196f3, #1976d2);
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div class="header-content">
                <h1>🍽️ 饮食记录</h1>
                <p>记录您的每一餐，科学管理饮食健康</p>
            </div>
        </div>
        
        <!-- 导航栏 -->
        <div class="nav-bar">
            <div class="nav-links">
                <a href="dashboard.html">🏠 首页</a>
                <a href="profile.html">👤 个人档案</a>
                <a href="survey.html">📋 体质测试</a>
                <a href="therapy.html">🥗 食疗方案</a>
                <a href="diet.html" class="active">🍽️ 饮食记录</a>
            </div>
        </div>
        
        <!-- 主要内容 -->
        <div class="main-content">
            <!-- 统计卡片 -->
            <div class="stats-cards">
                <div class="stat-card">
                    <div class="stat-icon" style="background: linear-gradient(135deg, #4caf50, #2e7d32);">
                        <i class="fas fa-fire"></i>
                    </div>
                    <div class="stat-content">
                        <div class="stat-value" id="total-calories">0</div>
                        <div class="stat-label">今日总热量</div>
                        <div class="stat-change positive" id="calories-change">+0 kcal</div>
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon" style="background: linear-gradient(135deg, #ff9800, #f57c00);">
                        <i class="fas fa-bread-slice"></i>
                    </div>
                    <div class="stat-content">
                        <div class="stat-value" id="carbs-amount">0g</div>
                        <div class="stat-label">碳水化合物</div>
                        <div class="stat-change" id="carbs-percent">0%</div>
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon" style="background: linear-gradient(135deg, #4caf50, #2e7d32);">
                        <i class="fas fa-drumstick-bite"></i>
                    </div>
                    <div class="stat-content">
                        <div class="stat-value" id="protein-amount">0g</div>
                        <div class="stat-label">蛋白质</div>
                        <div class="stat-change" id="protein-percent">0%</div>
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon" style="background: linear-gradient(135deg, #2196f3, #1976d2);">
                        <i class="fas fa-oil-can"></i>
                    </div>
                    <div class="stat-content">
                        <div class="stat-value" id="fat-amount">0g</div>
                        <div class="stat-label">脂肪</div>
                        <div class="stat-change" id="fat-percent">0%</div>
                    </div>
                </div>
            </div>
            
            <!-- 操作栏 -->
            <div class="action-bar">
                <div class="date-navigation">
                    <button class="btn-date" onclick="changeDate(-1)">
                        <i class="fas fa-chevron-left"></i> 前一天
                    </button>
                    <div class="current-date" id="current-date">加载中...</div>
                    <button class="btn-date" onclick="changeDate(1)">
                        后一天 <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
                
                <button class="btn-primary" onclick="openAddRecordModal()">
                    <i class="fas fa-plus"></i> 添加饮食记录
                </button>
            </div>
            
            <!-- 餐次标签 -->
            <div class="meal-tabs">
                <div class="meal-tab active" onclick="filterByMeal('all')">
                    <i class="fas fa-list"></i> 全部
                </div>
                <div class="meal-tab" onclick="filterByMeal('breakfast')">
                    <i class="fas fa-sun"></i> 早餐
                </div>
                <div class="meal-tab" onclick="filterByMeal('lunch')">
                    <i class="fas fa-utensils"></i> 午餐
                </div>
                <div class="meal-tab" onclick="filterByMeal('dinner')">
                    <i class="fas fa-moon"></i> 晚餐
                </div>
                <div class="meal-tab" onclick="filterByMeal('snack')">
                    <i class="fas fa-cookie-bite"></i> 加餐
                </div>
            </div>
            
            <!-- 饮食记录列表 -->
            <div class="diet-records" id="diet-records">
                <div class="empty-state">
                    <i class="fas fa-utensils"></i>
                    <h3>暂无饮食记录</h3>
                    <p>点击"添加饮食记录"按钮开始记录您的饮食</p>
                </div>
            </div>
            
            <!-- 营养成分图表 -->
            <div class="nutrition-chart">
                <h3 class="chart-title">📊 今日营养分布</h3>
                
                <div class="macronutrients">
                    <div class="macro-item carbs">
                        <div class="nutrition-value" id="carbs-value">0g</div>
                        <div class="nutrition-label">碳水化合物</div>
                        <div class="macro-bar">
                            <div class="macro-fill" id="carbs-bar" style="width: 0%"></div>
                        </div>
                        <div class="stat-change" id="carbs-percent-display">0%</div>
                    </div>
                    
                    <div class="macro-item protein">
                        <div class="nutrition-value" id="protein-value">0g</div>
                        <div class="nutrition-label">蛋白质</div>
                        <div class="macro-bar">
                            <div class="macro-fill" id="protein-bar" style="width: 0%"></div>
                        </div>
                        <div class="stat-change" id="protein-percent-display">0%</div>
                    </div>
                    
                    <div class="macro-item fat">
                        <div class="nutrition-value" id="fat-value">0g</div>
                        <div class="nutrition-label">脂肪</div>
                        <div class="macro-bar">
                            <div class="macro-fill" id="fat-bar" style="width: 0%"></div>
                        </div>
                        <div class="stat-change" id="fat-percent-display">0%</div>
                    </div>
                </div>
                
                <div class="micronutrients" id="micronutrients">
                    <!-- 微量营养素会动态生成 -->
                </div>
            </div>
            
            <!-- 常用食物推荐 -->
            <div class="common-foods">
                <h3 class="chart-title">🍎 常用食物推荐</h3>
                <p style="color: var(--text-light); margin-bottom: 15px;">点击食物快速添加到饮食记录</p>
                
                <div class="foods-grid" id="common-foods">
                    <!-- 常用食物会动态生成 -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- 添加/编辑记录模态框 -->
    <div class="modal" id="recordModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modal-title">添加饮食记录</div>
                <button class="modal-close" onclick="closeRecordModal()">&times;</button>
            </div>
            
            <div class="modal-body">
                <form id="recordForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">餐次</label>
                            <select class="form-select" id="record-meal" required>
                                <option value="">请选择餐次</option>
                                <option value="breakfast">早餐</option>
                                <option value="lunch">午餐</option>
                                <option value="dinner">晚餐</option>
                                <option value="snack">加餐</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">时间</label>
                            <input type="time" class="form-input" id="record-time" value="12:00" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">食物名称</label>
                        <input type="text" class="form-input" id="record-food" placeholder="例如：米饭、鸡肉、蔬菜等" required>
                    </div>
                    
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">份量 (克)</label>
                            <input type="number" class="form-input" id="record-weight" min="1" max="1000" value="100" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">热量 (千卡)</label>
                            <input type="number" class="form-input" id="record-calories" min="1" max="2000" placeholder="自动计算" required>
                        </div>
                    </div>
                    
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">碳水化合物 (克)</label>
                            <input type="number" class="form-input" id="record-carbs" min="0" step="0.1" value="0" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">蛋白质 (克)</label>
                            <input type="number" class="form-input" id="record-protein" min="0" step="0.1" value="0" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">脂肪 (克)</label>
                            <input type="number" class="form-input" id="record-fat" min="0" step="0.1" value="0" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">备注</label>
                        <textarea class="form-textarea" id="record-notes" rows="3" placeholder="可选：记录烹饪方式、口感等"></textarea>
                    </div>
                </form>
            </div>
            
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeRecordModal()">取消</button>
                <button class="btn-primary" onclick="saveRecord()">
                    <i class="fas fa-save"></i> 保存记录
                </button>
            </div>
        </div>
    </div>

    <script>
        // 模拟数据 - 用户信息
        const mockUserData = {
            name: "张伟",
            age: 32,
            height: 175,
            weight: 68,
            targetCalories: 2200, // 目标热量摄入
            constitution: "气虚质"
        };
        
        // 模拟数据 - 常用食物数据库
        const commonFoods = [
            { id: 1, name: "米饭", calories: 116, carbs: 25.9, protein: 2.6, fat: 0.3, unit: "100g" },
            { id: 2, name: "全麦面包", calories: 247, carbs: 41.3, protein: 13.0, fat: 3.4, unit: "100g" },
            { id: 3, name: "鸡胸肉", calories: 165, carbs: 0, protein: 31.0, fat: 3.6, unit: "100g" },
            { id: 4, name: "鸡蛋", calories: 155, carbs: 1.1, protein: 12.6, fat: 10.6, unit: "1个(约50g)" },
            { id: 5, name: "牛奶", calories: 54, carbs: 5.0, protein: 3.0, fat: 3.2, unit: "100ml" },
            { id: 6, name: "苹果", calories: 52, carbs: 13.8, protein: 0.3, fat: 0.2, unit: "1个(约150g)" },
            { id: 7, name: "香蕉", calories: 89, carbs: 22.8, protein: 1.1, fat: 0.3, unit: "1根(约118g)" },
            { id: 8, name: "西兰花", calories: 34, carbs: 6.6, protein: 2.8, fat: 0.4, unit: "100g" },
            { id: 9, name: "三文鱼", calories: 208, carbs: 0, protein: 20.4, fat: 13.4, unit: "100g" },
            { id: 10, name: "豆腐", calories: 76, carbs: 1.9, protein: 8.1, fat: 4.2, unit: "100g" },
            { id: 11, name: "牛肉", calories: 250, carbs: 0, protein: 26.0, fat: 15.0, unit: "100g" },
            { id: 12, name: "红薯", calories: 86, carbs: 20.1, protein: 1.6, fat: 0.1, unit: "100g" }
        ];
        
        // 模拟数据 - 饮食记录
        let dietRecords = [
            {
                id: 1,
                date: getTodayDate(),
                meal: "breakfast",
                time: "08:15",
                food: "全麦面包 + 牛奶 + 鸡蛋",
                weight: 250,
                calories: 320,
                carbs: 45,
                protein: 18,
                fat: 8,
                notes: "营养均衡的早餐"
            },
            {
                id: 2,
                date: getTodayDate(),
                meal: "lunch",
                time: "12:30",
                food: "米饭 + 鸡胸肉 + 西兰花",
                weight: 450,
                calories: 420,
                carbs: 55,
                protein: 35,
                fat: 6,
                notes: "少油烹饪"
            },
            {
                id: 3,
                date: getTodayDate(),
                meal: "dinner",
                time: "18:45",
                food: "红薯 + 三文鱼 + 蔬菜沙拉",
                weight: 380,
                calories: 380,
                carbs: 40,
                protein: 25,
                fat: 12,
                notes: "清淡晚餐"
            },
            {
                id: 4,
                date: getTodayDate(),
                meal: "snack",
                time: "15:20",
                food: "苹果 + 核桃",
                weight: 200,
                calories: 180,
                carbs: 25,
                protein: 4,
                fat: 8,
                notes: "下午加餐"
            }
        ];
        
        // 全局变量
        let currentDate = new Date();
        let currentMealFilter = 'all';
        let editingRecordId = null;
        
        // 页面加载
        document.addEventListener('DOMContentLoaded', function() {
            loadDietRecords();
            renderCommonFoods();
            updateDateDisplay();
        });
        
        // 获取今天的日期字符串
        function getTodayDate() {
            const today = new Date();
            return today.toISOString().split('T')[0];
        }
        
        // 格式化日期显示
        function formatDate(date) {
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            return date.toLocaleDateString('zh-CN', options);
        }
        
        // 更新日期显示
        function updateDateDisplay() {
            document.getElementById('current-date').textContent = formatDate(currentDate);
            
            // 加载对应日期的记录
            loadDietRecords();
        }
        
        // 切换日期
        function changeDate(days) {
            currentDate.setDate(currentDate.getDate() + days);
            updateDateDisplay();
        }
        
        // 按餐次筛选
        function filterByMeal(meal) {
            currentMealFilter = meal;
            
            // 更新标签状态
            document.querySelectorAll('.meal-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            document.querySelector(`.meal-tab[onclick*="${meal}"]`).classList.add('active');
            
            // 重新加载记录
            loadDietRecords();
        }
        
        // 加载饮食记录
        function loadDietRecords() {
            const dateStr = currentDate.toISOString().split('T')[0];
            
            // 筛选当天的记录
            let filteredRecords = dietRecords.filter(record => record.date === dateStr);
            
            // 按餐次筛选
            if (currentMealFilter !== 'all') {
                filteredRecords = filteredRecords.filter(record => record.meal === currentMealFilter);
            }
            
            // 按时间排序
            filteredRecords.sort((a, b) => a.time.localeCompare(b.time));
            
            // 渲染记录列表
            renderDietRecords(filteredRecords);
            
            // 更新统计数据
            updateStatistics(filteredRecords);
        }
        
        // 渲染饮食记录
        function renderDietRecords(records) {
            const container = document.getElementById('diet-records');
            
            if (records.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-utensils"></i>
                        <h3>暂无饮食记录</h3>
                        <p>点击"添加饮食记录"按钮开始记录您的饮食</p>
                    </div>
                `;
                return;
            }
            
            const mealLabels = {
                breakfast: '早餐',
                lunch: '午餐',
                dinner: '晚餐',
                snack: '加餐'
            };
            
            const mealIcons = {
                breakfast: 'fa-sun',
                lunch: 'fa-utensils',
                dinner: 'fa-moon',
                snack: 'fa-cookie-bite'
            };
            
            container.innerHTML = records.map(record => `
                <div class="record-item" data-id="${record.id}">
                    <div class="record-info">
                        <div class="record-header">
                            <span class="meal-tag ${record.meal}">
                                <i class="fas ${mealIcons[record.meal]}"></i> ${mealLabels[record.meal]}
                            </span>
                            <span class="record-time">${record.time}</span>
                        </div>
                        
                        <div class="record-foods">
                            <strong>${record.food}</strong>
                            <span style="color: var(--text-light); font-size: 0.9rem; margin-left: 10px;">
                                ${record.weight}g
                            </span>
                        </div>
                        
                        ${record.notes ? `<p style="color: var(--text-light); font-size: 0.9rem; margin: 5px 0;">${record.notes}</p>` : ''}
                        
                        <div class="record-nutrition">
                            <div class="nutrition-item">
                                <div class="nutrition-value">${record.calories} kcal</div>
                                <div class="nutrition-label">热量</div>
                            </div>
                            <div class="nutrition-item">
                                <div class="nutrition-value">${record.carbs}g</div>
                                <div class="nutrition-label">碳水</div>
                            </div>
                            <div class="nutrition-item">
                                <div class="nutrition-value">${record.protein}g</div>
                                <div class="nutrition-label">蛋白质</div>
                            </div>
                            <div class="nutrition-item">
                                <div class="nutrition-value">${record.fat}g</div>
                                <div class="nutrition-label">脂肪</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="record-actions">
                        <button class="btn-icon btn-edit" onclick="editRecord(${record.id})" title="编辑">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn-icon btn-delete" onclick="deleteRecord(${record.id})" title="删除">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }
        
        // 更新统计数据
        function updateStatistics(records) {
            // 计算总和
            const totals = records.reduce((acc, record) => ({
                calories: acc.calories + record.calories,
                carbs: acc.carbs + record.carbs,
                protein: acc.protein + record.protein,
                fat: acc.fat + record.fat
            }), { calories: 0, carbs: 0, protein: 0, fat: 0 });
            
            // 计算百分比
            const totalWeight = totals.carbs + totals.protein + totals.fat;
            const carbsPercent = totalWeight > 0 ? Math.round((totals.carbs / totalWeight) * 100) : 0;
            const proteinPercent = totalWeight > 0 ? Math.round((totals.protein / totalWeight) * 100) : 0;
            const fatPercent = totalWeight > 0 ? Math.round((totals.fat / totalWeight) * 100) : 0;
            
            // 更新显示
            document.getElementById('total-calories').textContent = totals.calories;
            document.getElementById('carbs-amount').textContent = totals.carbs.toFixed(1) + 'g';
            document.getElementById('protein-amount').textContent = totals.protein.toFixed(1) + 'g';
            document.getElementById('fat-amount').textContent = totals.fat.toFixed(1) + 'g';
            
            document.getElementById('carbs-percent').textContent = carbsPercent + '%';
            document.getElementById('protein-percent').textContent = proteinPercent + '%';
            document.getElementById('fat-percent').textContent = fatPercent + '%';
            
            // 更新热量变化
            const target = mockUserData.targetCalories;
            const diff = totals.calories - target;
            const caloriesChangeEl = document.getElementById('calories-change');
            caloriesChangeEl.textContent = (diff >= 0 ? '+' : '') + diff + ' kcal';
            caloriesChangeEl.className = diff > 0 ? 'stat-change negative' : 'stat-change positive';
            
            // 更新图表
            updateCharts(totals, carbsPercent, proteinPercent, fatPercent);
            
            // 更新微量营养素显示
            updateMicronutrients(records);
        }
        
        // 更新图表
        function updateCharts(totals, carbsPercent, proteinPercent, fatPercent) {
            // 更新条形图
            document.getElementById('carbs-bar').style.width = carbsPercent + '%';
            document.getElementById('protein-bar').style.width = proteinPercent + '%';
            document.getElementById('fat-bar').style.width = fatPercent + '%';
            
            // 更新数值
            document.getElementById('carbs-value').textContent = totals.carbs.toFixed(1) + 'g';
            document.getElementById('protein-value').textContent = totals.protein.toFixed(1) + 'g';
            document.getElementById('fat-value').textContent = totals.fat.toFixed(1) + 'g';
            
            document.getElementById('carbs-percent-display').textContent = carbsPercent + '%';
            document.getElementById('protein-percent-display').textContent = proteinPercent + '%';
            document.getElementById('fat-percent-display').textContent = fatPercent + '%';
        }
        
        // 更新微量营养素
        function updateMicronutrients(records) {
            // 模拟计算微量营养素
            const micronutrients = {
                fiber: 0,    // 膳食纤维
                calcium: 0,  // 钙
                iron: 0,     // 铁
                vitaminC: 0, // 维生素C
                vitaminD: 0  // 维生素D
            };
            
            // 根据记录估算（这里使用简单估算）
            records.forEach(record => {
                micronutrients.fiber += record.carbs * 0.1;     // 假设10%碳水是纤维
                micronutrients.calcium += record.calories * 0.1; // 简单估算
                micronutrients.iron += record.calories * 0.01;
                micronutrients.vitaminC += record.calories * 0.05;
                micronutrients.vitaminD += record.calories * 0.002;
            });
            
            const container = document.getElementById('micronutrients');
            container.innerHTML = `
                <div class="micro-item">
                    <span>膳食纤维</span>
                    <span>${micronutrients.fiber.toFixed(1)}g</span>
                </div>
                <div class="micro-item">
                    <span>钙</span>
                    <span>${micronutrients.calcium.toFixed(0)}mg</span>
                </div>
                <div class="micro-item">
                    <span>铁</span>
                    <span>${micronutrients.iron.toFixed(1)}mg</span>
                </div>
                <div class="micro-item">
                    <span>维生素C</span>
                    <span>${micronutrients.vitaminC.toFixed(0)}mg</span>
                </div>
                <div class="micro-item">
                    <span>维生素D</span>
                    <span>${micronutrients.vitaminD.toFixed(1)}μg</span>
                </div>
            `;
        }
        
        // 渲染常用食物
        function renderCommonFoods() {
            const container = document.getElementById('common-foods');
            container.innerHTML = commonFoods.map(food => `
                <div class="food-card" onclick="addCommonFood(${food.id})">
                    <div class="food-name">${food.name}</div>
                    <div class="food-calories">${food.calories} kcal / ${food.unit}</div>
                    <div style="font-size: 0.85rem; color: var(--text-light); margin-top: 5px;">
                        碳水:${food.carbs}g 蛋白:${food.protein}g 脂肪:${food.fat}g
                    </div>
                </div>
            `).join('');
        }
        
        // 添加常用食物
        function addCommonFood(foodId) {
            const food = commonFoods.find(f => f.id === foodId);
            if (!food) return;
            
            // 打开添加模态框并填充数据
            openAddRecordModal();
            
            // 填充食物信息
            document.getElementById('record-food').value = food.name;
            document.getElementById('record-weight').value = 100;
            
            // 计算100g的营养成分
            const weight = 100;
            const calories = (food.calories * weight / 100).toFixed(0);
            const carbs = (food.carbs * weight / 100).toFixed(1);
            const protein = (food.protein * weight / 100).toFixed(1);
            const fat = (food.fat * weight / 100).toFixed(1);
            
            document.getElementById('record-calories').value = calories;
            document.getElementById('record-carbs').value = carbs;
            document.getElementById('record-protein').value = protein;
            document.getElementById('record-fat').value = fat;
            
            document.getElementById('record-notes').value = `常用食物: ${food.name}`;
        }
        
        // 打开添加记录模态框
        function openAddRecordModal() {
            editingRecordId = null;
            document.getElementById('modal-title').textContent = '添加饮食记录';
            
            // 重置表单
            document.getElementById('recordForm').reset();
            document.getElementById('record-time').value = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            
            // 打开模态框
            document.getElementById('recordModal').classList.add('active');
        }
        
        // 编辑记录
        function editRecord(recordId) {
            const record = dietRecords.find(r => r.id === recordId);
            if (!record) return;
            
            editingRecordId = recordId;
            document.getElementById('modal-title').textContent = '编辑饮食记录';
            
            // 填充表单
            document.getElementById('record-meal').value = record.meal;
            document.getElementById('record-time').value = record.time;
            document.getElementById('record-food').value = record.food;
            document.getElementById('record-weight').value = record.weight;
            document.getElementById('record-calories').value = record.calories;
            document.getElementById('record-carbs').value = record.carbs;
            document.getElementById('record-protein').value = record.protein;
            document.getElementById('record-fat').value = record.fat;
            document.getElementById('record-notes').value = record.notes || '';
            
            // 打开模态框
            document.getElementById('recordModal').classList.add('active');
        }
        
        // 关闭模态框
        function closeRecordModal() {
            document.getElementById('recordModal').classList.remove('active');
        }
        
        // 保存记录
        function saveRecord() {
            // 获取表单数据
            const formData = {
                meal: document.getElementById('record-meal').value,
                time: document.getElementById('record-time').value,
                food: document.getElementById('record-food').value,
                weight: parseInt(document.getElementById('record-weight').value),
                calories: parseInt(document.getElementById('record-calories').value),
                carbs: parseFloat(document.getElementById('record-carbs').value),
                protein: parseFloat(document.getElementById('record-protein').value),
                fat: parseFloat(document.getElementById('record-fat').value),
                notes: document.getElementById('record-notes').value
            };
            
            // 验证
            if (!formData.meal || !formData.food || formData.weight <= 0) {
                showToast('请填写完整信息', 'error');
                return;
            }
            
            const dateStr = currentDate.toISOString().split('T')[0];
            
            if (editingRecordId) {
                // 更新记录
                const index = dietRecords.findIndex(r => r.id === editingRecordId);
                if (index !== -1) {
                    dietRecords[index] = {
                        ...dietRecords[index],
                        ...formData
                    };
                }
                showToast('记录更新成功', 'success');
            } else {
                // 添加新记录
                const newRecord = {
                    id: Date.now(), // 使用时间戳作为ID
                    date: dateStr,
                    ...formData
                };
                
                dietRecords.push(newRecord);
                showToast('记录添加成功', 'success');
            }
            
            // 关闭模态框
            closeRecordModal();
            
            // 重新加载记录
            loadDietRecords();
            
            // 保存到本地存储
            saveToLocalStorage();
        }
        
        // 删除记录
        function deleteRecord(recordId) {
            if (!confirm('确定要删除这条记录吗？')) {
                return;
            }
            
            const index = dietRecords.findIndex(r => r.id === recordId);
            if (index !== -1) {
                dietRecords.splice(index, 1);
                showToast('记录删除成功', 'success');
                
                // 重新加载记录
                loadDietRecords();
                
                // 保存到本地存储
                saveToLocalStorage();
            }
        }
        
        // 保存到本地存储
        function saveToLocalStorage() {
            try {
                localStorage.setItem('dietRecords', JSON.stringify(dietRecords));
            } catch (e) {
                console.error('保存到本地存储失败:', e);
            }
        }
        
        // 从本地存储加载
        function loadFromLocalStorage() {
            try {
                const saved = localStorage.getItem('dietRecords');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed)) {
                        dietRecords = parsed;
                    }
                }
            } catch (e) {
                console.error('从本地存储加载失败:', e);
            }
        }
        
        // 显示提示
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            
            document.body.appendChild(toast);
            
            // 3秒后移除
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => {
                    if (toast.parentNode) {
                        document.body.removeChild(toast);
                    }
                }, 300);
            }, 3000);
        }
        
        // 页面加载时从本地存储加载数据
        loadFromLocalStorage();
    </script>
</body>
</html>
