<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人健康档案 - 慧膳食刻</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        :root {
            --primary-color: #2e7d32;
            --primary-light: #4caf50;
            --primary-dark: #1b5e20;
            --secondary-color: #ff9800;
            --secondary-light: #ffb74d;
            --secondary-dark: #f57c00;
            --bg-color: #f8f9fa;
            --card-color: #ffffff;
            --text-color: #333333;
            --text-light: #666666;
            --border-color: #e0e0e0;
            --success-color: #4caf50;
            --warning-color: #ff9800;
            --danger-color: #f44336;
            --info-color: #2196f3;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        /* 头部样式 */
        .header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            color: white;
            padding: 25px 40px;
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%23ffffff" fill-opacity="0.1" d="M0,96L48,112C96,128,192,160,288,186.7C384,213,480,235,576,213.3C672,192,768,128,864,128C960,128,1056,192,1152,192C1248,192,1344,128,1392,96L1440,64L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>');
            background-size: cover;
            opacity: 0.1;
        }
        
        .header-content {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logo-icon {
            font-size: 2.5rem;
        }
        
        .logo-text h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .logo-text p {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        .user-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .btn-back {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        
        .btn-back:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 600px;
        }
        
        /* 侧边栏 */
        .sidebar {
            background: #f8f9fa;
            padding: 25px;
        }
        
        .user-card {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        
        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
        }
        
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
        }
        
        .user-name {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .user-email {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        
        .user-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .stat-item {
            text-align: center;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .stat-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary-color);
        }
        
        .stat-label {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 3px;
        }
        
        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            border-radius: 10px;
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .nav-item:hover {
            background: white;
            transform: translateX(5px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        }
        
        .nav-item.active {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            color: white;
            box-shadow: 0 3px 10px rgba(46, 125, 50, 0.2);
        }
        
        .nav-item i {
            width: 20px;
            text-align: center;
        }
        
        /* 内容区域 */
        .content {
            padding: 30px;
        }
        
        .content-section {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .content-section.active {
            display: block;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }
        
        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section-title i {
            color: var(--primary-color);
        }
        
        .btn-edit {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-edit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 125, 50, 0.2);
        }
        
        /* 表单样式 */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .form-label i {
            color: var(--primary-color);
            width: 20px;
        }
        
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
            background: white;
        }
        
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
        }
        
        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 125, 50, 0.3);
        }
        
        .btn-secondary {
            background: white;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .btn-secondary:hover {
            background: var(--bg-color);
        }
        
        /* 健康卡片 */
        .health-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .health-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            border-left: 4px solid var(--primary-color);
            transition: all 0.3s;
        }
        
        .health-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }
        
        .health-card.warning {
            border-left-color: var(--warning-color);
        }
        
        .health-card.success {
            border-left-color: var(--success-color);
        }
        
        .health-card.info {
            border-left-color: var(--info-color);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
        }
        
        .card-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: white;
        }
        
        .card-icon.bg-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
        }
        
        .card-icon.bg-warning {
            background: linear-gradient(135deg, var(--warning-color) 0%, var(--secondary-light) 100%);
        }
        
        .card-icon.bg-success {
            background: linear-gradient(135deg, var(--success-color) 0%, #66bb6a 100%);
        }
        
        .card-icon.bg-info {
            background: linear-gradient(135deg, var(--info-color) 0%, #42a5f5 100%);
        }
        
        .card-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .card-label {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        
        .card-footer {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            font-size: 0.9rem;
            color: var(--text-light);
        }
        
        /* 体质信息卡片 */
        .constitution-card {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            border-left: 6px solid var(--primary-color);
        }
        
        .constitution-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .constitution-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-dark);
        }
        
        .constitution-tag {
            background: var(--primary-color);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .constitution-desc {
            margin-bottom: 15px;
            line-height: 1.7;
        }
        
        /* 记录列表 */
        .record-list {
            margin-top: 20px;
        }
        
        .record-item {
            display: grid;
            grid-template-columns: 100px 1fr 150px;
            gap: 20px;
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            align-items: center;
        }
        
        .record-item:hover {
            background: #f9f9f9;
        }
        
        .record-date {
            font-weight: 600;
            color: var(--primary-color);
        }
        
        .record-values {
            display: flex;
            gap: 20px;
        }
        
        .record-value {
            text-align: center;
        }
        
        .record-value .value {
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .record-value .label {
            font-size: 0.8rem;
            color: var(--text-light);
        }
        
        /* 加载动画 */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(46, 125, 50, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 提示信息 */
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid var(--success-color);
        }
        
        .alert-warning {
            background: #fff3cd;
            color: #856404;
            border-left: 4px solid var(--warning-color);
        }
        
        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid var(--danger-color);
        }
        
        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid var(--info-color);
        }
        
        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalFadeIn 0.3s ease;
        }
        
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-color);
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
            transition: color 0.3s;
        }
        
        .modal-close:hover {
            color: var(--danger-color);
        }
        
        .modal-body {
            padding: 20px;
        }
        
        .modal-footer {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .header-content {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }
            
            .health-cards {
                grid-template-columns: 1fr;
            }
            
            .record-item {
                grid-template-columns: 1fr;
                gap: 10px;
            }
        }
        
        /* 消息提示 */
        #message-toast {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            max-width: 300px;
        }
        
        .toast {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .toast-success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid var(--success-color);
        }
        
        .toast-error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid var(--danger-color);
        }
        
        .toast-info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid var(--info-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon">🥗</div>
                    <div class="logo-text">
                        <h1>慧膳食刻</h1>
                        <p>个性化食疗，健康每一天</p>
                    </div>
                </div>
                <div class="user-actions">
                    <a href="dashboard.html" class="btn-back">
                        <i class="fas fa-arrow-left"></i> 返回首页
                    </a>
                </div>
            </div>
        </div>
        
        <!-- 主内容区域 -->
        <div class="main-content">
            <!-- 侧边栏 -->
            <div class="sidebar">
                <div class="user-card">
                    <div class="avatar-container">
                        <div class="avatar" id="user-avatar">U</div>
                    </div>
                    <div class="user-name" id="user-name">加载中...</div>
                    <div class="user-email" id="user-email">加载中...</div>
                    
                    <div class="user-stats">
                        <div class="stat-item">
                            <div class="stat-value" id="stat-age">--</div>
                            <div class="stat-label">年龄</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="stat-bmi">--</div>
                            <div class="stat-label">BMI</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="stat-height">--</div>
                            <div class="stat-label">身高(cm)</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="stat-weight">--</div>
                            <div class="stat-label">体重(kg)</div>
                        </div>
                    </div>
                </div>
                
                <div class="nav-menu">
                    <div class="nav-item active" onclick="showSection('profile')">
                        <i class="fas fa-user"></i>
                        <span>个人信息</span>
                    </div>
                    <div class="nav-item" onclick="showSection('health')">
                        <i class="fas fa-heartbeat"></i>
                        <span>健康信息</span>
                    </div>
                    <div class="nav-item" onclick="showSection('records')">
                        <i class="fas fa-history"></i>
                        <span>健康记录</span>
                    </div>
                    <div class="nav-item" onclick="showSection('constitution')">
                        <i class="fas fa-leaf"></i>
                        <span>体质分析</span>
                    </div>
                    <div class="nav-item" onclick="showSection('settings')">
                        <i class="fas fa-cog"></i>
                        <span>账户设置</span>
                    </div>
                </div>
            </div>
            
            <!-- 内容区域 -->
            <div class="content">
                <!-- 个人信息部分 -->
                <div class="content-section active" id="profile-section">
                    <div class="section-header">
                        <div class="section-title">
                            <i class="fas fa-user-circle"></i>
                            个人信息
                        </div>
                        <button class="btn-edit" onclick="toggleEditMode('profile')">
                            <i class="fas fa-edit"></i>
                            编辑信息
                        </button>
                    </div>
                    
                    <div id="profile-display">
                        <div class="form-grid">
                            <div class="form-group">
                                <label class="form-label"><i class="fas fa-user"></i>用户名</label>
                                <div class="form-input display-mode" id="display-username">加载中...</div>
                            </div>
                            <div class="form-group">
                                <label class="form-label"><i class="fas fa-envelope"></i>电子邮箱</label>
                                <div class="form-input display-mode" id="display-email">加载中...</div>
                            </div>
                            <div class="form-group">
                                <label class="form-label"><i class="fas fa-signature"></i>昵称</label>
                                <div class="form-input display-mode" id="display-nickname">加载中...</div>
                            </div>
                            <div class="form-group">
                                <label class="form-label"><i class="fas fa-venus-mars"></i>性别</label>
                                <div class="form-input display-mode" id="display-gender">加载中...</div>
                            </div>

    <script>
        // 全局变量
        let currentUser = null;
        let currentHealthData = null;
        const API_BASE = 'http://localhost:3000/api';
        
        // 页面加载
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('Profile页面加载完成');
            
            // 检查登录状态
            await checkLoginStatus();
            
            // 加载用户信息
            await loadUserProfile();
            
            // 设置默认显示的section
            showSection('profile');
            
            // 设置今日日期
            document.getElementById('record-date').value = new Date().toISOString().split('T')[0];
        });
        
        // 检查登录状态
        async function checkLoginStatus() {
            const token = localStorage.getItem('token');
            const userInfo = localStorage.getItem('userInfo');
            
            if (!token || !userInfo) {
                alert('请先登录');
                window.location.href = 'login.html';
                return false;
            }
            
            try {
                currentUser = JSON.parse(userInfo);
                console.log('当前用户:', currentUser);
                return true;
            } catch (error) {
                console.error('解析用户信息失败:', error);
                localStorage.removeItem('token');
                localStorage.removeItem('userInfo');
                window.location.href = 'login.html';
                return false;
            }
        }
        
        // 加载用户信息
        async function loadUserProfile() {
            try {
                console.log('开始加载用户信息...');
                
                const response = await fetch(`${API_BASE}/user/profile?user_id=${currentUser.id}`);
                
                console.log('API响应状态:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP错误: ${response.status}`);
                }
                
                const result = await response.json();
                console.log('API返回结果:', result);
                
                if (result.code === 200) {
                    currentHealthData = result.data;
                    
                    // 更新侧边栏用户信息
                    updateSidebarInfo(result.data.user);
                    
                    // 更新个人信息显示
                    updateProfileDisplay(result.data);
                    
                    // 更新健康信息显示
                    updateHealthDisplay(result.data);
                    
                    console.log('用户信息加载完成');
                } else {
                    console.error('获取用户信息失败:', result.msg);
                    showMessage('加载失败: ' + result.msg, 'error');
                }
            } catch (error) {
                console.error('加载用户信息失败:', error);
                showMessage('网络错误: ' + error.message, 'error');
            }
        }
        
        // 更新侧边栏信息
        function updateSidebarInfo(userData) {
            document.getElementById('user-name').textContent = userData.nickname || userData.username;
            document.getElementById('user-email').textContent = userData.email || '未设置邮箱';
            document.getElementById('user-avatar').textContent = (userData.nickname || userData.username).charAt(0).toUpperCase();
        }
        
        // 更新个人信息显示
        function updateProfileDisplay(data) {
            const user = data.user;
            const health = data.health || {};
            
            // 更新展示模式
            document.getElementById('display-username').textContent = user.username || '未设置';
            document.getElementById('display-email').textContent = user.email || '未设置';
            document.getElementById('display-nickname').textContent = user.nickname || '未设置';
            document.getElementById('display-gender').textContent = 
                health.gender === 'male' ? '男' : 
                health.gender === 'female' ? '女' : '未设置';
            document.getElementById('display-birthday').textContent = user.birthday || '未设置';
            document.getElementById('display-phone').textContent = user.phone || '未设置';
            
            // 更新编辑模式表单
            document.getElementById('edit-username').value = user.username || '';
            document.getElementById('edit-email').value = user.email || '';
            document.getElementById('edit-nickname').value = user.nickname || '';
            document.getElementById('edit-gender').value = health.gender || '';
            document.getElementById('edit-birthday').value = user.birthday || '';
            document.getElementById('edit-phone').value = user.phone || '';
        }
        
        // 更新健康信息显示
        function updateHealthDisplay(data) {
            const health = data.health || {};
            const bmi = data.bmi;
            
            // 更新展示模式
            document.getElementById('display-height').textContent = health.height ? `${health.height} cm` : '未设置';
            document.getElementById('display-weight').textContent = health.weight ? `${health.weight} kg` : '未设置';
            document.getElementById('display-constitution').textContent = health.constitution || '未设置';
            
            // 更新编辑模式表单
            document.getElementById('edit-height').value = health.height || '';
            document.getElementById('edit-weight').value = health.weight || '';
            document.getElementById('edit-health-gender').value = health.gender || '';
            document.getElementById('edit-age').value = health.age || '';
            document.getElementById('edit-bp-sys').value = health.blood_pressure_sys || '';
            document.getElementById('edit-bp-dia').value = health.blood_pressure_dia || '';
            document.getElementById('edit-blood-sugar').value = health.blood_sugar || '';
            document.getElementById('edit-sleep-hours').value = health.sleep_hours || '';
            document.getElementById('edit-exercise-frequency').value = health.exercise_frequency || '';
            document.getElementById('edit-constitution').value = health.constitution || '';
            document.getElementById('edit-allergies').value = health.allergies || '';
            document.getElementById('edit-chronic-diseases').value = health.chronic_diseases || '';
            
            // 更新健康卡片
            updateHealthCards(health, bmi);
            
            // 更新统计信息
            document.getElementById('stat-age').textContent = health.age || '--';
            document.getElementById('stat-height').textContent = health.height || '--';
            document.getElementById('stat-weight').textContent = health.weight || '--';
            document.getElementById('stat-bmi').textContent = bmi ? bmi.bmi : '--';
        }
        
        // 更新健康卡片
        function updateHealthCards(health, bmi) {
            const cardsContainer = document.getElementById('health-stats-cards');
            
            if (!health.height || !health.weight) {
                cardsContainer.innerHTML = `
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle"></i>
                        <div>
                            <strong>请完善健康信息</strong>
                            <p>填写身高和体重后，系统将自动计算您的BMI指数。</p>
                        </div>
                    </div>
                `;
                return;
            }
            
            let cardsHTML = `
                <div class="health-cards">
                    <div class="health-card ${getBMIColorClass(bmi.status)}">
                        <div class="card-header">
                            <div class="card-title">身体质量指数</div>
                            <div class="card-icon bg-primary">
                                <i class="fas fa-weight"></i>
                            </div>
                        </div>
                        <div class="card-value">${bmi.bmi}</div>
                        <div class="card-label">${bmi.status}</div>
                        <div class="card-footer">${bmi.advice}</div>
                    </div>
            `;
            
            if (health.blood_pressure_sys && health.blood_pressure_dia) {
                cardsHTML += `
                    <div class="health-card success">
                        <div class="card-header">
                            <div class="card-title">血压</div>
                            <div class="card-icon bg-success">
                                <i class="fas fa-tachometer-alt"></i>
                            </div>
                        </div>
                        <div class="card-value">${health.blood_pressure_sys}/${health.blood_pressure_dia}</div>
                        <div class="card-label">mmHg</div>
                        <div class="card-footer">${getBloodPressureStatus(health.blood_pressure_sys, health.blood_pressure_dia)}</div>
                    </div>
                `;
            }
            
            if (health.blood_sugar) {
                cardsHTML += `
                    <div class="health-card info">
                        <div class="card-header">
                            <div class="card-title">空腹血糖</div>
                            <div class="card-icon bg-info">
                                <i class="fas fa-tint"></i>
                            </div>
                        </div>
                        <div class="card-value">${health.blood_sugar}</div>
                        <div class="card-label">mmol/L</div>
                        <div class="card-footer">${getBloodSugarStatus(health.blood_sugar)}</div>
                    </div>
                `;
            }
            
            cardsHTML += '</div>';
            cardsContainer.innerHTML = cardsHTML;
        }
        
        // 切换编辑模式
        function toggleEditMode(mode) {
            const displayElement = document.getElementById(`${mode}-display`);
            const editElement = document.getElementById(`${mode}-edit`);
            
            if (displayElement.style.display !== 'none') {
                // 切换到编辑模式
                displayElement.style.display = 'none';
                editElement.style.display = 'block';
                
                // 如果是健康信息模式，计算BMI预览
                if (mode === 'health') {
                    calculateBMIPreview();
                }
            } else {
                // 切换回显示模式
                displayElement.style.display = 'block';
                editElement.style.display = 'none';
            }
        }
        
        // 实时计算BMI预览
        function calculateBMIPreview() {
            const height = parseFloat(document.getElementById('edit-height').value);
            const weight = parseFloat(document.getElementById('edit-weight').value);
            const previewContainer = document.getElementById('bmi-preview-container');
            
            if (!height || !weight || height <= 0 || weight <= 0) {
                previewContainer.style.display = 'none';
                return;
            }
            
            const heightM = height / 100;
            const bmi = weight / (heightM * heightM);
            
            let status = '';
            let color = '#4caf50';
            let icon = '📊';
            
            if (bmi < 18.5) {
                status = '体重过轻';
                color = '#ff9800';
                icon = '⚠️';
            } else if (bmi < 24) {
                status = '正常体重';
                color = '#4caf50';
                icon = '✅';
            } else if (bmi < 28) {
                status = '超重';
                color = '#ff9800';
                icon = '⚠️';
            } else {
                status = '肥胖';
                color = '#f44336';
                icon = '❗';
            }
            
            document.getElementById('bmi-preview-value').textContent = bmi.toFixed(1);
            document.getElementById('bmi-preview-status').textContent = status;
            document.getElementById('bmi-preview-status').style.color = color;
            document.getElementById('bmi-preview-icon').textContent = icon;
            
            previewContainer.style.display = 'block';
        }
        
        // 获取BMI颜色类
        function getBMIColorClass(status) {
            if (status.includes('正常')) return 'success';
            if (status.includes('过轻') || status.includes('超重')) return 'warning';
            if (status.includes('肥胖')) return 'danger';
            return '';
        }
        
        // 获取血压状态
        function getBloodPressureStatus(sys, dia) {
            if (!sys || !dia) return '未测量';
            if (sys < 120 && dia < 80) return '正常';
            if (sys < 130 && dia < 80) return '正常高值';
            if (sys < 140 && dia < 90) return '高血压1级';
            if (sys < 180 || dia < 110) return '高血压2级';
            return '高血压3级';
        }
        
        // 获取血糖状态
        function getBloodSugarStatus(sugar) {
            if (!sugar) return '未测量';
            if (sugar < 3.9) return '低血糖';
            if (sugar < 6.1) return '正常';
            if (sugar < 7.0) return '空腹血糖受损';
            return '糖尿病';
        }
        
        // 保存个人信息
        async function saveProfileInfo() {
            const profileData = {
                user_id: currentUser.id,
                nickname: document.getElementById('edit-nickname').value,
                gender: document.getElementById('edit-gender').value,
                birthday: document.getElementById('edit-birthday').value,
                phone: document.getElementById('edit-phone').value
            };
            
            // 如果有邮箱字段，也包含进去
            if (document.getElementById('edit-email')) {
                profileData.email = document.getElementById('edit-email').value;
            }
            
            try {
                const response = await fetch(`${API_BASE}/user/basic-info`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(profileData)
                });
                
                const result = await response.json();
                
                if (result.code === 200) {
                    showMessage('个人信息保存成功', 'success');
                    toggleEditMode('profile');
                    
                    // 重新加载用户信息
                    await loadUserProfile();
                } else {
                    showMessage('保存失败: ' + result.msg, 'error');
                }
            } catch (error) {
                showMessage('网络错误: ' + error.message, 'error');
            }
        }
        
        // 保存健康信息
        async function saveHealthInfo() {
            const healthData = {
                user_id: currentUser.id,
                age: document.getElementById('edit-age').value || null,
                gender: document.getElementById('edit-health-gender').value || null,
                height: document.getElementById('edit-height').value || null,
                weight: document.getElementById('edit-weight').value || null,
                constitution: document.getElementById('edit-constitution').value || null,
                blood_pressure_sys: document.getElementById('edit-bp-sys').value || null,
                blood_pressure_dia: document.getElementById('edit-bp-dia').value || null,
                blood_sugar: document.getElementById('edit-blood-sugar').value || null,
                sleep_hours: document.getElementById('edit-sleep-hours').value || null,
                exercise_frequency: document.getElementById('edit-exercise-frequency').value || null,
                allergies: document.getElementById('edit-allergies').value || null,
                chronic_diseases: document.getElementById('edit-chronic-diseases').value || null
            };
            
            try {
                const response = await fetch(`${API_BASE}/user/health-info`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(healthData)
                });
                
                const result = await response.json();
                
                if (result.code === 200) {
                    showMessage('健康信息保存成功', 'success');
                    toggleEditMode('health');
                    
                    // 重新加载用户信息
                    await loadUserProfile();
                } else {
                    showMessage('保存失败: ' + result.msg, 'error');
                }
            } catch (error) {
                showMessage('网络错误: ' + error.message, 'error');
            }
        }
        
        // 加载健康记录
        async function loadHealthRecords() {
            try {
                const response = await fetch(`${API_BASE}/user/health-records?user_id=${currentUser.id}&limit=10`);
                const result = await response.json();
                
                if (result.code === 200) {
                    renderHealthRecords(result.data);
                } else {
                    showMessage('获取健康记录失败: ' + result.msg, 'error');
                }
            } catch (error) {
                console.error('加载健康记录失败:', error);
                showMessage('网络错误，请检查后端服务器', 'error');
            }
        }
        
        // 渲染健康记录
        function renderHealthRecords(records) {
            const recordsContent = document.getElementById('records-content');
            
            if (!records || records.length === 0) {
                recordsContent.innerHTML = `
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle"></i>
                        <div>
                            <strong>暂无健康记录</strong>
                            <p>点击"添加记录"按钮开始记录您的健康数据。</p>
                        </div>
                    </div>
                `;
                return;
            }
            
            let recordsHtml = `
                <div class="record-list">
                    <div class="record-item" style="font-weight: bold; background: #f8f9fa;">
                        <div>日期</div>
                        <div>健康指标</div>
                        <div>备注</div>
                    </div>
            `;
            
            records.forEach(record => {
                recordsHtml += `
                    <div class="record-item">
                        <div class="record-date">${formatDate(record.record_date)}</div>
                        <div class="record-values">
                            ${record.weight ? `
                                <div class="record-value">
                                    <div class="value">${record.weight}</div>
                                    <div class="label">体重(kg)</div>
                                </div>
                            ` : ''}
                            
                            ${(record.blood_pressure_sys && record.blood_pressure_dia) ? `
                                <div class="record-value">
                                    <div class="value">${record.blood_pressure_sys}/${record.blood_pressure_dia}</div>
                                    <div class="label">血压</div>
                                </div>
                            ` : ''}
                            
                            ${record.blood_sugar ? `
                                <div class="record-value">
                                    <div class="value">${record.blood_sugar}</div>
                                    <div class="label">血糖</div>
                                </div>
                            ` : ''}
                        </div>
                        <div>${record.notes || '--'}</div>
                    </div>
                `;
            });
            
            recordsHtml += '</div>';
            recordsContent.innerHTML = recordsHtml;
        }
        
        // 显示添加记录模态框
        function showAddRecordModal() {
            document.getElementById('addRecordModal').classList.add('active');
        }
        
        // 关闭添加记录模态框
        function closeAddRecordModal() {
            document.getElementById('addRecordModal').classList.remove('active');
        }
        
        // 保存健康记录
        async function saveHealthRecord() {
            const recordData = {
                user_id: currentUser.id,
                record_date: document.getElementById('record-date').value,
                weight: document.getElementById('record-weight').value ? parseFloat(document.getElementById('record-weight').value) : null,
                blood_pressure_sys: document.getElementById('record-bp-sys').value ? parseInt(document.getElementById('record-bp-sys').value) : null,
                blood_pressure_dia: document.getElementById('record-bp-dia').value ? parseInt(document.getElementById('record-bp-dia').value) : null,
                blood_sugar: document.getElementById('record-blood-sugar').value ? parseFloat(document.getElementById('record-blood-sugar').value) : null,
                sleep_hours: document.getElementById('record-sleep-hours').value ? parseFloat(document.getElementById('record-sleep-hours').value) : null,
                energy_level: document.getElementById('record-energy-level').value,
                symptoms: document.getElementById('record-symptoms').value,
                notes: document.getElementById('record-notes').value
            };
            
            try {
                const response = await fetch(`${API_BASE}/user/health-record`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(recordData)
                });
                
                const result = await response.json();
                
                if (result.code === 200) {
                    showMessage('健康记录保存成功', 'success');
                    closeAddRecordModal();
                    
                    // 重新加载健康记录
                    await loadHealthRecords();
                    
                    // 清空表单
                    document.getElementById('record-weight').value = '';
                    document.getElementById('record-bp-sys').value = '';
                    document.getElementById('record-bp-dia').value = '';
                    document.getElementById('record-blood-sugar').value = '';
                    document.getElementById('record-sleep-hours').value = '';
                    document.getElementById('record-energy-level').value = '';
                    document.getElementById('record-symptoms').value = '';
                    document.getElementById('record-notes').value = '';
                    
                } else {
                    showMessage('保存失败: ' + result.msg, 'error');
                }
            } catch (error) {
                console.error('保存健康记录失败:', error);
                showMessage('网络错误: ' + error.message, 'error');
            }
        }
        
        // 加载体质详情
        async function loadConstitutionDetail(constitutionType) {
            try {
                const response = await fetch(`${API_BASE}/constitution/${encodeURIComponent(constitutionType)}`);
                
                const result = await response.json();
                
                if (result.code === 200) {
                    renderConstitutionDetail(result.data);
                } else {
                    showMessage('获取体质详情失败: ' + result.msg, 'error');
                }
            } catch (error) {
                console.error('加载体质详情失败:', error);
                showMessage('网络错误，请检查后端服务器', 'error');
            }
        }
        
        // 渲染体质详情
        function renderConstitutionDetail(constitutionData) {
            const constitutionContent = document.getElementById('constitution-content');
            
            constitutionContent.innerHTML = `
                <div class="constitution-card">
                    <div class="constitution-header">
                        <div class="constitution-title">${constitutionData.name}</div>
                        <span class="constitution-tag">${constitutionData.name}</span>
                    </div>
                    
                    <p class="constitution-desc">${constitutionData.description}</p>
                    
                    <div class="constitution-details">
                        <div class="detail-item">
                            <h4><i class="fas fa-user-check"></i> 主要特征</h4>
                            <p>${constitutionData.characteristics}</p>
                        </div>
                        
                        <div class="detail-item">
                            <h4><i class="fas fa-apple-alt"></i> 饮食建议</h4>
                            <p>${constitutionData.food_suggestions}</p>
                        </div>
                        
                        <div class="detail-item">
                            <h4><i class="fas fa-ban"></i> 避免食物</h4>
                            <p>${constitutionData.food_avoid}</p>
                        </div>
                        
                        <div class="detail-item">
                            <h4><i class="fas fa-running"></i> 生活方式</h4>
                            <p>${constitutionData.lifestyle}</p>
                        </div>
                    </div>
                    
                    <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(0,0,0,0.1);">
                        <h4><i class="fas fa-prescription-bottle-alt"></i> 调理建议</h4>
                        <p>${constitutionData.therapy_suggestions}</p>
                    </div>
                </div>
            `;
        }
        
        // 加载体质测试
        function loadConstitutionTest() {
            const constitutionContent = document.getElementById('constitution-content');
            
            constitutionContent.innerHTML = `
                <div class="alert alert-info">
                    <i class="fas fa-info-circle"></i>
                    <div>
                        <strong>体质测试功能开发中</strong>
                        <p>体质辨识问卷功能正在开发中，敬请期待！</p>
                    </div>
                </div>
            `;
        }
        
        // 更改密码
        async function changePassword() {
            const currentPassword = document.getElementById('current-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            if (!currentPassword || !newPassword || !confirmPassword) {
                showMessage('请填写所有密码字段', 'error');
                return;
            }
            
            if (newPassword.length < 6) {
                showMessage('新密码至少需要6个字符', 'error');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showMessage('两次输入的密码不一致', 'error');
                return;
            }
            
            showMessage('密码修改功能正在开发中', 'info');
            
            // 清空表单
            document.getElementById('current-password').value = '';
            document.getElementById('new-password').value = '';
            document.getElementById('confirm-password').value = '';
        }
        
        // 退出登录
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('userInfo');
            showMessage('已退出登录', 'success');
            
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        }
        
       
        function showSection(sectionId) {
            // 更新导航激活状态
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            
            // 激活当前导航项
            document.querySelector(`.nav-item[onclick="showSection('${sectionId}')"]`).classList.add('active');
            
            // 隐藏所有内容区域
            document.querySelectorAll('.content-section').forEach(section => {
                section.classList.remove('active');
            });
            
            // 显示选中的内容区域
            document.getElementById(`${sectionId}-section`).classList.add('active');
            
            // 如果是健康记录部分，加载记录
            if (sectionId === 'records') {
                loadHealthRecords();
            }
            
            // 如果是体质分析部分，加载体质信息
            if (sectionId === 'constitution' && currentHealthData?.user?.constitution) {
                loadConstitutionDetail(currentHealthData.user.constitution);
            }
        }
        
        // 显示加载状态
        function showLoading(sectionId) {
            const section = document.getElementById(`${sectionId}-section`);
            if (section) {
                const content = section.querySelector('.form-grid, .health-cards, #records-content, #constitution-content');
                if (content) {
                    content.innerHTML = `
                        <div class="loading">
                            <div class="spinner"></div>
                            <p>加载中...</p>
                        </div>
                    `;
                }
            }
        }
        
        // 隐藏加载状态
        function hideLoading(sectionId) {
            // 这个函数现在主要用于标记加载完成
        }
        
        // 显示消息
        function showMessage(message, type = 'info') {
            const toast = document.getElementById('message-toast');
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `toast toast-${type}`;
            messageDiv.innerHTML = `
                <div style="display: flex; align-items: center; gap: 10px;">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
                    <span>${message}</span>
                </div>
            `;
            
            toast.appendChild(messageDiv);
            toast.style.display = 'block';
            
            // 3秒后自动移除
            setTimeout(() => {
                messageDiv.style.opacity = '0';
                messageDiv.style.transform = 'translateX(100%)';
                setTimeout(() => {
                    toast.removeChild(messageDiv);
                    if (toast.children.length === 0) {
                        toast.style.display = 'none';
                    }
                }, 300);
            }, 3000);
        }
        
        // 格式化日期
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('zh-CN', { 
                year: 'numeric', 
                month: '2-digit', 
                day: '2-digit' 
            });
        }
    </script>
</body>
</html>
