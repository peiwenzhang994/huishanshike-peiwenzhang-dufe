<!DOCTYPE html>
<html>
<head>
  <title>体质辨识问卷 - 慧膳食刻</title>
  <style>
    body { font-family: Arial; max-width: 800px; margin: 0 auto; padding: 20px; }
    .question { margin: 30px 0; padding: 20px; background: #f9f9f9; border-radius: 10px; }
    .options label { display: block; margin: 10px 0; padding: 12px; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; }
    .options label:hover { background: #f0f0f0; }
    .options input:checked + span { background: #e8f5e9; font-weight: bold; }
    .btn-submit { background: linear-gradient(135deg, #2e7d32, #4caf50); color: white; padding: 15px 40px; border: none; border-radius: 25px; font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>🧬 中医体质辨识问卷</h1>
  <p>请根据您过去一年的体验和感觉回答以下问题</p>
  
  <form id="survey-form">
    <!-- 问题1 -->
    <div class="question">
      <h3>1. 您容易疲乏吗？</h3>
      <div class="options">
        <label><input type="radio" name="q1" value="1"> <span>没有（根本不）</span></label>
        <label><input type="radio" name="q1" value="2"> <span>很少（有一点）</span></label>
        <label><input type="radio" name="q1" value="3"> <span>有时（有些）</span></label>
        <label><input type="radio" name="q1" value="4"> <span>经常（相当）</span></label>
        <label><input type="radio" name="q1" value="5"> <span>总是（非常）</span></label>
      </div>
    </div>
    
    <!-- 更多问题...（实际需要9道题） -->
    
    <button type="button" class="btn-submit" onclick="submitSurvey()">提交问卷</button>
  </form>
  
  <script>
    const API_BASE = 'http://localhost:3000/api';
    
    async function submitSurvey() {
      const answers = collectAnswers();
      const userInfo = JSON.parse(localStorage.getItem('userInfo'));
      
      if (!userInfo) {
        alert('请先登录');
        window.location.href = 'login.html';
        return;
      }
      
      try {
        const response = await fetch(`${API_BASE}/survey`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: userInfo.id,
            answers: answers
          })
        });
        
        const result = await response.json();
        
        if (result.code === 200) {
          // 显示体质结果
          showResult(result.data);
        } else {
          alert('提交失败: ' + result.msg);
        }
      } catch (error) {
        alert('网络错误: ' + error.message);
      }
    }
    
    function collectAnswers() {
      // 收集所有问题答案
      return {
        q1: document.querySelector('input[name="q1"]:checked')?.value,
        // ... 其他问题
      };
    }
    
    function showResult(data) {
      // 显示体质分析结果
      document.body.innerHTML = `
        <div style="text-align: center; padding: 40px;">
          <h1>🎉 体质辨识完成</h1>
          <div style="font-size: 24px; color: #2e7d32; margin: 20px 0;">
            您的体质是：<strong>${data.constitution}</strong>
          </div>
          <p>${data.description}</p>
          <h3>饮食建议：</h3>
          <p>${data.diet_advice}</p>
          <button onclick="goToProfile()" style="background: #2e7d32; color: white; padding: 10px 20px; border: none; border-radius: 5px; margin-top: 20px;">
            查看详细建议
          </button>
        </div>
      `;
    }
    
    function goToProfile() {
      window.location.href = 'profile.html';
    }
  </script>
</body>
</html>
