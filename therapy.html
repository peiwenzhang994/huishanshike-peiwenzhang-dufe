                    "控制食量，避免过饱",
                    "适当运动，帮助化湿"
                ],
                herbalRecommendations: [
                    "茯苓（利水渗湿）", "薏苡仁（健脾利湿）", "陈皮（理气化痰）", 
                    "半夏（燥湿化痰）", "荷叶（清热利湿）"
                ],
                recipes: [
                    {
                        id: 1,
                        name: "薏米赤小豆粥",
                        description: "健脾祛湿，利水消肿",
                        ingredients: ["薏米", "赤小豆", "茯苓", "芡实"],
                        method: "所有材料浸泡后煮1-2小时成粥",
                        benefits: "健脾利湿，清热解毒"
                    },
                    {
                        id: 2,
                        name: "冬瓜海带汤",
                        description: "利尿消肿，清热化痰",
                        ingredients: ["冬瓜", "海带", "虾米", "姜片"],
                        method: "冬瓜、海带切块，与虾米同煮30分钟，调味",
                        benefits: "利水渗湿，清热化痰"
                    }
                ]
            }
        };
        
        // 页面加载时生成食疗方案
        document.addEventListener('DOMContentLoaded', function() {
            // 获取用户体质类型（这里使用模拟数据）
            const userConstitution = mockUserData.constitution;
            
            // 更新用户信息
            updateUserInfo();
            
            // 生成食疗方案
            generateDietPlan(userConstitution);
        });
        
        // 更新用户信息
        function updateUserInfo() {
            document.getElementById('user-name').textContent = mockUserData.name;
            document.getElementById('user-age').textContent = `年龄：${mockUserData.age}岁`;
            document.getElementById('user-bmi').textContent = `BMI：${mockUserData.bmi}`;
            document.getElementById('constitution-type').textContent = mockUserData.constitution;
        }
        
        // 生成食疗方案
        function generateDietPlan(constitution) {
            const plan = dietPlans[constitution] || dietPlans["平和质"];
            
            // 更新推荐食物
            const recommendFoodsEl = document.getElementById('recommend-foods');
            recommendFoodsEl.innerHTML = `
                <p>${plan.description}</p>
                <div style="margin-top: 15px;">
                    ${plan.recommendFoods.map(food => 
                        `<span class="food-item">${food}</span>`
                    ).join('')}
                </div>
            `;
            
            // 更新忌食食物
            const avoidFoodsEl = document.getElementById('avoid-foods');
            avoidFoodsEl.innerHTML = `
                <div>
                    ${plan.avoidFoods.map(food => 
                        `<span class="food-item">${food}</span>`
                    ).join('')}
                </div>
            `;
            
            // 更新饮食禁忌
            const dietTaboosEl = document.getElementById('diet-taboos');
            dietTaboosEl.innerHTML = `
                <ul>
                    ${plan.dietPrinciples.map(principle => 
                        `<li>✅ ${principle}</li>`
                    ).join('')}
                </ul>
            `;
            
            // 更新食疗药材
            const herbalEl = document.getElementById('herbal-recommendations');
            herbalEl.innerHTML = `
                <p><strong>推荐药材：</strong></p>
                <div style="margin-top: 10px;">
                    ${plan.herbalRecommendations.map(herb => 
                        `<span class="food-item" style="background:#e3f2fd;color:#1565c0;">${herb}</span>`
                    ).join('')}
                </div>
                <p style="margin-top: 15px; color: #666; font-style: italic;">
                    注意：药材使用前请咨询中医师，根据个人情况调整用量。
                </p>
            `;
            
            // 更新食谱推荐
            const recipesGrid = document.getElementById('recipes-grid');
            recipesGrid.innerHTML = plan.recipes.map(recipe => `
                <div class="recipe-card">
                    <div class="recipe-image">
                        🥘
                    </div>
                    <div class="recipe-content">
                        <h3 class="recipe-title">${recipe.name}</h3>
                        <p class="recipe-desc">${recipe.description}</p>
                        
                        <div class="recipe-ingredients">
                            <p><strong>主要食材：</strong></p>
                            ${recipe.ingredients.map(ingredient => 
                                `<span class="ingredient-tag">${ingredient}</span>`
                            ).join('')}
                        </div>
                        
                        <div class="recipe-method">
                            <h4>👩‍🍳 制作方法</h4>
                            <p>${recipe.method}</p>
                        </div>
                        
                        <div style="margin-top: 15px; padding: 10px; background: #e8f5e9; border-radius: 8px;">
                            <strong>功效：</strong> ${recipe.benefits}
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        // 重新生成方案
        function generateNewPlan() {
            // 这里可以随机选择一个体质类型来演示
            const constitutions = Object.keys(dietPlans);
            const randomConstitution = constitutions[Math.floor(Math.random() * constitutions.length)];
            
            // 更新用户体质显示
            mockUserData.constitution = randomConstitution;
            document.getElementById('constitution-type').textContent = randomConstitution;
            
            // 重新生成方案
            generateDietPlan(randomConstitution);
            
            // 显示提示
            showMessage(`已为您重新生成 ${randomConstitution} 的食疗方案`, 'info');
        }
        
        // 打印方案
        function printPlan() {
            showMessage('准备打印食疗方案...', 'info');
            setTimeout(() => {
                window.print();
            }, 500);
        }
        
        // 保存方案
        function savePlan() {
            const planData = {
                user: mockUserData,
                plan: dietPlans[mockUserData.constitution] || dietPlans["平和质"],
                generatedAt: new Date().toLocaleString()
            };
            
            // 保存到本地存储
            localStorage.setItem('savedDietPlan', JSON.stringify(planData));
            
            showMessage('食疗方案已保存到本地！', 'success');
        }
        
        // 显示消息提示
        function showMessage(message, type = 'info') {
            // 创建消息元素
            const messageEl = document.createElement('div');
            messageEl.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 15px 20px;
                border-radius: 8px;
                color: white;
                font-weight: 500;
                z-index: 1000;
                animation: slideIn 0.3s ease;
                box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            `;
            
            // 根据类型设置背景色
            if (type === 'success') {
                messageEl.style.background = 'linear-gradient(135deg, #4caf50, #2e7d32)';
            } else if (type === 'error') {
                messageEl.style.background = 'linear-gradient(135deg, #f44336, #d32f2f)';
            } else {
                messageEl.style.background = 'linear-gradient(135deg, #2196f3, #1976d2)';
            }
            
            messageEl.textContent = message;
            
            // 添加到页面
            document.body.appendChild(messageEl);
            
            // 3秒后移除
            setTimeout(() => {
                messageEl.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => {
                    document.body.removeChild(messageEl);
                }, 300);
            }, 3000);
            
            // 添加动画样式
            if (!document.querySelector('#message-styles')) {
                const styleEl = document.createElement('style');
                styleEl.id = 'message-styles';
                styleEl.textContent = `
                    @keyframes slideIn {
                        from { transform: translateX(100%); opacity: 0; }
                        to { transform: translateX(0); opacity: 1; }
                    }
                    @keyframes slideOut {
                        from { transform: translateX(0); opacity: 1; }
                        to { transform: translateX(100%); opacity: 0; }
                    }
                `;
                document.head.appendChild(styleEl);
            }
        }
        
        // 加载已保存的方案
        function loadSavedPlan() {
            const savedPlan = localStorage.getItem('savedDietPlan');
            if (savedPlan) {
                try {
                    const planData = JSON.parse(savedPlan);
                    mockUserData.constitution = planData.user.constitution || mockUserData.constitution;
                    updateUserInfo();
                    generateDietPlan(mockUserData.constitution);
                } catch (e) {
                    console.error('加载保存的方案失败:', e);
                }
            }
        }
        
        // 初始化时加载已保存的方案
        loadSavedPlan();
    </script>
</body>
</html>
